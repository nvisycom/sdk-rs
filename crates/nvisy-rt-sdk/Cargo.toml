# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-rt-sdk"
description = "Nvisy Runtime REST/HTTP API client library"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
readme = "README.md"
documentation = "https://docs.nvisy.com"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## Default features enabled by default
default = ["rustls-tls"]

# TLS backends (mutually exclusive - pick one)
## Enable rustls for HTTPS requests (default)
rustls-tls = ["reqwest/rustls"]
## Enable native-tls for HTTPS requests
native-tls = ["reqwest/native-tls"]

# Observability
## Enable tracing support for HTTP requests and client operations
tracing = ["dep:tracing", "dep:reqwest-tracing"]

[dependencies]
# HTTP
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
reqwest-retry = { workspace = true }
url = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Primitives
jiff = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Derive macros
derive_builder = { workspace = true }

# Observability
tracing = { workspace = true, optional = true }
reqwest-tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
