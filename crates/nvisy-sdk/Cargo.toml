# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-sdk"
description = "Rust client for the Nvisy Server API: authentication, workspace management, and task routing"
readme = "README.md"

# Release
version = { workspace = true }
publish = { workspace = true }
license = { workspace = true }

# Rust
edition = { workspace = true }
rust-version = { workspace = true }

# Metadata
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## Default features enabled by default
default = ["rustls-tls"]

# TLS backends (mutually exclusive: pick one)
## Enable rustls for HTTPS requests (default)
rustls-tls = ["reqwest/rustls"]
## Enable native-tls for HTTPS requests
native-tls = ["reqwest/native-tls"]

# Observability
## Enable tracing support for HTTP requests and client operations
tracing = ["dep:tracing", "dep:reqwest-tracing"]

[dependencies]
# HTTP
reqwest = { workspace = true, features = [] }
reqwest-middleware = { workspace = true, features = [] }
reqwest-retry = { workspace = true, features = [] }
url = { workspace = true, features = [] }

# Serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }

# Primitives
jiff = { workspace = true, features = [] }
uuid = { workspace = true, features = [] }

# Error handling
thiserror = { workspace = true, features = [] }

# Derive macros
derive_builder = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, optional = true, features = [] }
reqwest-tracing = { workspace = true, optional = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = [] }

[[example]]
name = "basic"
path = "examples/basic.rs"
