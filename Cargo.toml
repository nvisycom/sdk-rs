# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-sdk"
description = "Rust client for the Nvisy Server API: authentication, workspace management, and task routing"
readme = "README.md"

# Release
version = "0.1.1"
publish = true
license = "MIT"

# Rust
edition = "2024"
rust-version = "1.92"

# Metadata
authors = ["Nvisy <support@nvisy.com>"]
repository = "https://github.com/nvisycom/sdk-rs"
homepage = "https://nvisy.com"
documentation = "https://docs.nvisy.com"
keywords = ["nvisy", "redaction", "pii", "sdk", "async"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.docs.rs]
features = ["rustls-tls", "tracing"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
## Default features enabled by default
default = ["rustls-tls"]

# TLS backends (mutually exclusive: pick one)
## Enable rustls for HTTPS requests (default)
rustls-tls = ["reqwest/rustls"]
## Enable native-tls for HTTPS requests
native-tls = ["reqwest/native-tls"]

# Observability
## Enable tracing support for HTTP requests and client operations
tracing = ["dep:tracing", "dep:reqwest-tracing"]

[dependencies]
# HTTP
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
reqwest-middleware = { version = "0.5", features = ["json", "multipart", "query"] }
reqwest-retry = { version = "0.9", features = [] }
url = { version = "2.5", features = [] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }

# Primitives
jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1.22", features = ["serde", "v4"] }

# Error handling
thiserror = { version = "2.0", features = [] }

# Derive macros
derive_builder = { version = "0.20", features = [] }

# Observability
tracing = { version = "0.1", optional = true, features = [] }
reqwest-tracing = { version = "0.7", optional = true, features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[[example]]
name = "basic"
path = "examples/basic.rs"
