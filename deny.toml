# Configuration for cargo-deny
# See: https://embarkstudios.github.io/cargo-deny/

# Target platforms to check dependencies against
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

# Security advisory database checks
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Warn on unmaintained crates, deny yanked ones
unmaintained = "warn"
yanked = "deny"
ignore = []

# Allowed dependency licenses
[licenses]
confidence-threshold = 0.9
private = { ignore = false, registries = [] }
unused-allowed-license = "warn"

# Permissive and weakly copyleft licenses only
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

exceptions = []

# Crate bans and duplicate detection
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []

deny = [
    # Prefer rustls over OpenSSL
    { name = "openssl-sys", version = "*" },
    { name = "openssl", version = "*" },
]

skip = []
skip-tree = []

# Allowed crate sources (registries and git repos)
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
